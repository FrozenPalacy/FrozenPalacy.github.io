  /* 跟随笔尖的小白点 */

    fill: #fff;
    opacity: 0;
    transition: opacity .3s ease;
  }
  #penTip.on { opacity: 1; }

    opacity: 0;
    transition: opacity .3s ease;
  }
  #penGlow.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #boot { transition: none; }

  const PARAMS   = new URLSearchParams(location.search);
  const PREVIEW  = PARAMS.has('preview');      // ?preview 静态展示，不跳转
  const LANG_ARG = PARAMS.get('lang');         // ?lang=ja 只看某语言
  const REDUCED  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const NS = 'http://www.w3.org/2000/svg';
  const boot  = document.getElementById('boot');
  const svg   = document.getElementById('helloSvg');
  const group = document.getElementById('langGroup');
  const pen   = document.getElementById('penTip');
  const penGlow = document.getElementById('penGlow');

  /* lock page scroll while the boot curtain is up */
  if (!PREVIEW) document.body.style.overflow = 'hidden';

  /* 笔尖（含光晕底垫）同步移动 / 显隐 */
  function movePen(x, y) {
    pen.setAttribute('cx', x);
    pen.setAttribute('cy', y);
    penGlow.setAttribute('cx', x);
    penGlow.setAttribute('cy', y);
  }
  function penOn(v) {
    pen.classList.toggle('on', v);
    penGlow.classList.toggle('on', v);
  }

  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  /* 播放序列：en → 中文三个 → 希腊语 → 其余按数据顺序；?lang=xx 指定单语言 */
  const HEAD = ['en', 'zh-Hans', 'zh-Hant', 'zh_HK', 'el'];
  let seq;
  if (LANG_ARG) {
    const i = LANGS.findIndex(l => l.id === LANG_ARG);
    seq = i >= 0 ? [i] : LANGS.map((l, k) => k);
  } else {
    seq = HEAD.map(function (id) { return LANGS.findIndex(l => l.id === id); })
      .concat(LANGS.map(function (l, k) { return k; })
        .filter(function (k) { return HEAD.indexOf(LANGS[k].id) < 0; }));
  }

  const st = { pos: 0, raf: null, wd: null, done: false, holdT: null, fadeT: null, finalT: null, finalized: false };

  /* 构建当前语言路径组，并按包围盒动态设置 viewBox 与笔迹宽度 */
  function setupLang(idx) {
    group.innerHTML = '';
    const lang = LANGS[idx];
    lang._els = lang.paths.map(function (d) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      group.appendChild(p);
      return p;
    });
    lang._lens = lang._els.map(function (e) {
      const L = e.getTotalLength();
      /* Safari 对超大/复杂路径 getTotalLength 偶发 NaN：用 d 文本长度
         估算兜底，避免 dasharray 失效导致该笔画提前整条显现（错位感）。
         注意：0 是合法的圆点（dot）语义，必须保留，不能被兜底覆盖 */
      return isFinite(L) && L >= 0 ? L : Math.max(50, e.getAttribute('d').length * 1.5);
    });
    /* 笔迹包围盒：优先用数据自带（生成时精确计算）的 viewBox，
       绕开 iPhone Safari 对刚插入路径组 getBBox 懒布局返回不全值的时序问题
       （路径最多的繁体尤其明显）；getBBox 仅作数据缺失时的兜底 */
    let vx, vy, vw, vh;
    if (lang.viewBox) {
      const vb = String(lang.viewBox).trim().split(/\s+/).map(Number);
      if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) { vx = vb[0]; vy = vb[1]; vw = vb[2]; vh = vb[3]; }
    }
    if (!(vw > 0 && vh > 0)) {
      const b = group.getBBox();
      if (b.width > 0 && b.height > 0) { vx = b.x; vy = b.y; vw = b.width; vh = b.height; }
      else { vx = 0; vy = 0; vw = 2000; vh = 1200; }
    }
    const pad = Math.max(vw, vh) * 0.18;
    svg.setAttribute('viewBox', (vx - pad) + ' ' + (vy - pad) + ' ' + (vw + pad * 2) + ' ' + (vh + pad * 2));
    /* 显式像素尺寸：不依赖浏览器对动态 viewBox 的 height:auto 重算
       （Safari 会按旧比例渲染导致笔画变形/乱跳），直接写死宽高。
       两轴均不超过视口 92%，并保留原 CSS 的 255vh 上限语义。
       尺寸在每次 setupLang 与视口变化（URL 栏收起/展开、旋转）时重算 */
    svg._fitW = vw + pad * 2;
    svg._fitH = vh + pad * 2;
    fitSvg();
    const sw = Math.max(3, vh * 0.06);
    lang._sw = sw;
    lang._els.forEach(function (el, i) {
      el.style.strokeWidth = sw + 'px';
      if (!(lang._lens[i] > 0)) {
        /* 零长度路径（i/j 圆点等）：不走 dasharray（Chromium 渲染不稳定），
           用透明度在其时序窗口内平滑淡入 */
        el.style.opacity = 0;
        el.style.transition = 'opacity .15s ease';
      }
    });
    pen.setAttribute('r', sw * 0.55);
    penGlow.setAttribute('r', sw * 1.8);
  }

  /* 视口可用高度：visualViewport 才能反映 iPhone URL 栏收起/展开后的真实高度 */
  function viewH() {
    const vv = window.visualViewport;
    return vv && vv.height > 0 ? vv.height : window.innerHeight;
  }
  function fitSvg() {
    const fw = svg._fitW, fh = svg._fitH;
    if (!(fw > 0 && fh > 0)) return;
    const scale = Math.min(
      (window.innerWidth * 0.92) / fw,
      (viewH() * 0.92) / fh,
      (viewH() * 2.55) / fw
    );
    svg.style.width = Math.max(1, fw * scale) + 'px';
    svg.style.height = Math.max(1, fh * scale) + 'px';
  }
  let fitTimer = null;
  function scheduleFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitSvg, 150);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleFit);
  window.addEventListener('orientationchange', scheduleFit);

  /* 按各路径长度比例分配 DRAW_MS，逐条书写；笔尖跟随当前路径 */
  function drawLang(idx, done) {
    const els = LANGS[idx]._els;
    const lens = LANGS[idx]._lens;
    const sw = LANGS[idx]._sw;
    /* 圆点（零长度路径）按自身直径折算虚拟长度，获得真实时间窗口平滑淡入，
       不再在最后一帧突变弹出 */
    const vt = lens.map(function (l) { return l > 0 ? l : sw; });
    const total = vt.reduce(function (a, b) { return a + b; }, 0);

    /* Safari 对复杂路径 getTotalLength 偶发低估（真机 iPhone 明显）：
       dasharray 加安全余量（5% + 一个笔宽），保证每笔尾部与下一笔的接头
       始终被墨水覆盖（囉口字旁末横、拉丁变音符衔接问题） */
    const dash = lens.map(function (l) { return l > 0 ? l * 1.05 + sw : 0; });
    els.forEach(function (e, i) {
      if (!(lens[i] > 0)) return;
      e.style.strokeDasharray  = dash[i];
      e.style.strokeDashoffset = dash[i];
    });
    /* 笔尖先就位再显现，避免以旧语言收笔位置闪现一帧 */
    const startPt = els[0].getPointAtLength(0);
    movePen(startPt.x, startPt.y);
    penOn(true);

    const t0 = performance.now();
    let acc = 0, pi = 0;

    function step(now) {
      const p = easeInOut(Math.min(1, (now - t0) / DRAW_MS));
      const target = p * total;
      while (pi < lens.length && acc + vt[pi] <= target) {
        if (!(lens[pi] > 0)) {
          els[pi].style.opacity = 1;  /* 圆点窗口走完，完全显现 */
        } else {
          els[pi].style.strokeDashoffset = 0;  /* 非圆点被消费即完成：确定性归零，
              不再依赖帧率，杜绝完成态缺笔（囉口字旁末横/变音符） */
        }
        acc += vt[pi];
        pi++;
      }
      if (pi >= lens.length) {
        penOn(false);
        clearTimeout(st.wd);
        for (var zi = 0; zi < lens.length; zi++) {
          if (lens[zi] > 0) els[zi].style.strokeDashoffset = 0;  /* 兜底归零 */
        }
        done();
        return;
      }
      if (!(lens[pi] > 0)) {
        /* 圆点窗口进行中：随书写进度淡入，笔尖/光晕移到圆点处 */
        els[pi].style.opacity = Math.min(1, (target - acc) / sw);
        const dp = els[pi].getPointAtLength(0);
        movePen(dp.x, dp.y);
      } else {
        const inPath = Math.min(lens[pi], target - acc);
        /* 墨水长度恒等于笔尖进度（covered = dash - offset = inPath），
           余量全部落在尾端，笔尖/光晕与墨迹末端始终重合 */
        els[pi].style.strokeDashoffset = dash[pi] - inPath;
        const pt = els[pi].getPointAtLength(Math.min(inPath, lens[pi]));
        movePen(pt.x, pt.y);
      }
      if (p >= 1) {
        penOn(false);
        clearTimeout(st.wd);
        done();
        return;
      }
      st.raf = requestAnimationFrame(step);
    }

    /* 兜底：rAF 冻结（后台标签页）时仍推进当前语言 */
    st.wd = setTimeout(function () {
      penOn(false);
      done();
    }, DRAW_MS + 800);

    st.raf = requestAnimationFrame(step);
  }

  function onLangDone() {
    if (st.done) return;
    st.done = true;
    /* 停留 → 淡出 → 下一语言 */
    st.holdT = setTimeout(function () {
      group.style.opacity = 0;
      svg.setAttribute('data-phase', 'fade');
      st.fadeT = setTimeout(function () {
        playLang(st.pos + 1);
      }, FADE_MS);
    }, HOLD_MS);
  }

  function playLang(pos) {
    if (pos >= seq.length) { finalize(); return; }
    st.pos = pos;
    st.done = false;
    setupLang(seq[pos]);
    svg.setAttribute('data-lang', LANGS[seq[pos]].id);
    svg.setAttribute('data-phase', 'draw');
    group.style.opacity = 1;
    drawLang(seq[pos], onLangDone);
  }

  function finalize(delay) {
    st.finalized = true;
    st.finalT = setTimeout(function () {
      boot.classList.add('up');
      setTimeout(finish, SLIDE_MS + 120);
    }, delay == null ? END_HOLD_MS : delay);
  }

  /* click: finish immediately - no per-language skip */
  function advance() {
    if (PREVIEW || REDUCED || st.finalized) return;
    cancelAnimationFrame(st.raf);
    clearTimeout(st.wd);
    clearTimeout(st.holdT);
    clearTimeout(st.fadeT);
    penOn(false);
    finalize(0);
  }
  boot.addEventListener('click', advance);

  function finish() {
    if (PREVIEW) return;
    document.body.style.overflow = '';
    if (boot) boot.remove();
  }

  /* 绝对兜底：整个动画无论如何在预算内收尾 */
  const TOTAL_MS = START_DELAY + seq.length * (DRAW_MS + HOLD_MS + FADE_MS) + END_HOLD_MS + SLIDE_MS + 2000;
  setTimeout(function () {
    if (boot && !boot.classList.contains('up')) {
      boot.classList.add('up');
      setTimeout(finish, SLIDE_MS + 120);
    }
  }, TOTAL_MS);

  /* ============ 启动 ============ */
  if (PREVIEW || REDUCED) {
    /* 静态展示当前语言成品 */
    setupLang(seq[0]);
    LANGS[seq[0]]._els.forEach(function (el, i) {
      const len = LANGS[seq[0]]._lens[i];
      if (!(len > 0)) {
        el.style.opacity = 1;
      } else {
        el.style.strokeDasharray  = len * 1.05 + LANGS[seq[0]]._sw;
        el.style.strokeDashoffset = 0;
      }
    });
    if (REDUCED && !PREVIEW) setTimeout(finish, 600);
  } else {
    setTimeout(function () { playLang(0); }, START_DELAY);
  }
})();

</script><div id="root"></div>
</body>
</html>
